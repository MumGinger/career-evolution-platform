name: CI

on:
  pull_request:
  push:
    branches:
      - chore/project-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-tests:
    name: Unit and integration
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Check patch whitespace (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check patch whitespace (branch push)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: git diff --check HEAD^...HEAD

  http-contract:
    name: HTTP and representative PDF contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run HTTP and applicant contract tests
        run: npm run test:http-contract

  browser-e2e:
    name: Real browser shipped flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CEP_RUNTIME_EVIDENCE_PATH: /tmp/issue140-natural-shipped-flow-evidence.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove changed browser regressions are red on the pre-fix commit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_regressions="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- tests/browser-e2e | grep -v '/[^/]*pre-beta[^/]*\.spec\.js$' || true)"
          if [ -z "$changed_regressions" ]; then
            echo "Only pre-Beta quality gates changed; pre-fix RED proof is not required."
            exit 0
          fi
          git worktree add ../pre-fix "${{ github.event.pull_request.base.sha }}"
          rm -rf ../pre-fix/tests/browser-e2e
          mkdir -p ../pre-fix/tests/browser-e2e
          cp -R tests/browser-e2e/. ../pre-fix/tests/browser-e2e/
          find ../pre-fix/tests/browser-e2e -name '*pre-beta*.spec.js' -delete
          cp playwright.config.js ../pre-fix/playwright.config.js
          ln -s "$GITHUB_WORKSPACE/node_modules" ../pre-fix/node_modules
          set +e
          (cd ../pre-fix && "$GITHUB_WORKSPACE/node_modules/.bin/playwright" test --config=playwright.config.js --workers=1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected at least one changed applicant-facing regression to fail on the pre-fix commit, but all passed."
            exit 1
          fi
          echo "Pre-fix browser regression failed as expected; green proof follows on the pull-request head."

      - name: Run real browser end-to-end regressions and quality gates
        shell: bash
        run: |
          rm -f "$CEP_RUNTIME_EVIDENCE_PATH"
          npm run test:browser-e2e

      - name: Validate machine-bound natural shipped-flow evidence
        run: node scripts/validate-shipped-flow-evidence.js "$CEP_RUNTIME_EVIDENCE_PATH"

      - name: Freeze complex pre-Beta quality candidate
        env:
          CEP_RUNTIME_EVIDENCE_PATH: test-results/runtime-evidence/issue134-pre-beta-complex-golden.json
          CEP_QUALITY_PDF_PATH: test-results/runtime-evidence/issue134-pre-beta-complex-golden.pdf
        run: npx playwright test tests/browser-e2e/issue134-pre-beta-complex-golden.spec.js --config=playwright.config.js --workers=1

      - name: Validate machine-bound pre-Beta quality evidence
        run: node scripts/validate-shipped-flow-evidence.js test-results/runtime-evidence/issue134-pre-beta-complex-golden.json

      - name: Materialize independently reviewed Milestone 1 scorecard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = 'reports/pre-beta-quality/issue134-complex-golden-v1-scorecard.json';
          const target = 'test-results/runtime-evidence/milestone1-exit-scorecard.json';
          const scorecard = JSON.parse(fs.readFileSync(source, 'utf8'));
          scorecard.reviewed_final_pdf_sha256 = '7fc13d318695959eb25e5a0919f83bc52e548f6d80c7307e57683d97b7b7e768';
          scorecard.review_scope = 'Milestone 1 exit candidate independently reviewed after primary CI run 31754879205 at commit 02028e4cd4fea9f3b426633e155b58bec6ee8fc3. The exact one-page Letter PDF was preflighted and rendered at 200 DPI; this score is valid only for these PDF bytes.';
          scorecard.dimensions.typography_spacing_density_page_composition = 8;
          scorecard.review.total = 90;
          scorecard.review.verdict = 'BETA READY';
          scorecard.review.rendered_pdf = 'PASS: exact one-page Letter PDF rendered at 200 DPI with no clipping, overlap, broken glyphs, empty bullets, cross-entry bleed, duplicate project bodies, or section-identity failure.';
          scorecard.review.preflight = 'PASS: PDF 1.4, one page, Letter, unencrypted, no forms or JavaScript, extractable text.';
          const typography = (scorecard.review.deductions || []).find((item) => item.dimension === 'typography_spacing_density_page_composition');
          if (typography) {
            typography.points_lost = 2;
            typography.reason = 'Hierarchy and spacing are clean, but unused lower-page whitespace and conservative Helvetica typesetting limit visual polish.';
          }
          fs.mkdirSync('test-results/runtime-evidence', { recursive: true });
          fs.writeFileSync(target, `${JSON.stringify(scorecard, null, 2)}\n`);
          NODE

      - name: Enforce reviewed PDF quality gate
        run: npm run pre-beta:gate -- test-results/runtime-evidence/milestone1-exit-scorecard.json test-results/runtime-evidence/issue134-pre-beta-complex-golden.json

      - name: Upload frozen complex pre-Beta quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issue134-pre-beta-complex-golden
          path: |
            test-results/runtime-evidence/issue134-pre-beta-complex-golden.json
            test-results/runtime-evidence/issue134-pre-beta-complex-golden.pdf
            test-results/runtime-evidence/milestone1-exit-scorecard.json
          if-no-files-found: error
