name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full test suite
        run: npm test

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
