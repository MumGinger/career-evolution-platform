name: CI

on:
  pull_request:
  push:
    branches:
      - chore/project-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-tests:
    name: Unit and integration
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Check patch whitespace (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check patch whitespace (branch push)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: git diff --check HEAD^...HEAD

  http-contract:
    name: HTTP and representative PDF contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run HTTP and applicant contract tests
        run: npm run test:http-contract

  browser-e2e:
    name: Real browser shipped flow
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real browser end-to-end test
        run: npm run test:browser-e2e
