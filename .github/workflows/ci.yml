name: CI

on:
  pull_request:
  push:
    branches:
      - agent/test-hermeticity-before-beta-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full test suite
        run: npm test

      - name: Check patch whitespace (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check patch whitespace (branch push)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: git diff --check HEAD^...HEAD
